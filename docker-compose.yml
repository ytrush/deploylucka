services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduweb-app
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:dHmXz3geCId96XIX479wa6zV65sowgX5D3EwKQrd+b4="
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eduweb
      DB_USERNAME: eduweb
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: eduweb-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eduweb
      MYSQL_USER: eduweb
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: